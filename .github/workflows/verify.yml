name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify explorer aggregates and comparisons
        run: node --test src/test/js/explorer.test.cjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify Windows and synthetic Maven resolution
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/run-lab.ps1
      - name: Verify Linux and synthetic Maven resolution
        if: runner.os == 'Linux'
        run: ./scripts/run-lab.sh
